<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aníbal Vargas - Lanzamientos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #bb86fc;
            margin-bottom: 30px;
        }
        .song-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .song-title {
            font-size: 1.4em;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>Lanzamientos de Aníbal Vargas</h1>

    <!-- Canción Nueva -->
    <div class="song-card">
        <div class="song-title">💜 Espero Tu Respuesta — Aníbal Vargas</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/hW-Exgyz6NY" 
                    title="💜 Espero Tu Respuesta — Aníbal Vargas" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Canción Anterior 1 -->
    <div class="song-card">
        <div class="song-title">Cualquiera Menos Tú — Aníbal Vargas</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/R5yH3S1kIn4" 
                    title="Cualquiera Menos Tú — Aníbal Vargas" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Canción Anterior 2 -->
    <div class="song-card">
        <div class="song-title">¿Cómo Estás? — Aníbal Vargas</div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/S2qTzIu-K3A" 
                    title="¿Cómo Estás? — Aníbal Vargas" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
